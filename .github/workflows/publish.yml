name: Publish Selenium Autopilot

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Python package
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/selenium-autopilot/

    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest
          pip install -e .

      - name: Run tests
        run: |
          pytest -m "not integration and not live_site"

      - name: Build package
        run: |
          python -m build

      - name: Validate distribution
        run: |
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1